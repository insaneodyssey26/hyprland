[general]
lower_cutoff_freq = 40
higher_cutoff_freq = 14000
bars = 8
framerate = 30

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59

[smoothing]
integral = 75
monstercat = 1
gravity = 130

[eq]
1 = 1.05
2 = 1.0
3 = 1.0
4 = 1.1
5 = 1.2
6 = 1.3
7 = 1.45
8 = 1.6
