[main]
exit-on-lost-focus=yes
layer=top
font=Geist Medium:size=11
prompt="❯ "
icon-theme=Papirus-Dark
width=45
lines=10
horizontal-pad=20
vertical-pad=15
inner-pad=10
line-height=25
letter-spacing=0.2
selection-wrap=yes

# Border settings in main for compatibility
border-radius=40
border-width=3

[colors]
text=#e3e2e3ff
prompt=#b3cad9ff
input=#e3e2e3ff
match=#b3cad9ff
selection=#34353680
selection-text=#b3cad9ff
selection-match=#b3cad9ff
background=#121314e6
# High-visibility primary border
border=#b3cad9ff

[border]
radius=40
width=3
