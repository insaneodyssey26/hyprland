# ==============================================================================
# MPV Modern Configuration
# ==============================================================================

# --- UI & Window ---
# Required for uosc to replace the default UI cleanly
osc=no
osd-bar=no
border=no
cursor-autohide=1000
cursor-autohide-fs-only=yes
keep-open=yes
save-position-on-quit=yes
autofit-larger=85%x85%
geometry=50%:50%

# --- Video & Wayland Workspace Freeze Prevention ---
vo=gpu-next
gpu-context=wayland
hwdec=auto-safe
profile=gpu-hq
video-sync=audio
wayland-disable-vsync=yes
wayland-configure-bounds=yes
hr-seek=yes

# --- Audio ---
ao=pipewire,pulse
audio-file-auto=fuzzy
volume=100
volume-max=150

# --- Subtitles (Geist Typography) ---
sub-auto=fuzzy
sub-font="Geist Medium"
sub-font-size=40
sub-bold=yes
sub-blur=0.2
sub-border-color="#1e1e2e"
sub-border-size=3.0
sub-color="#ffffff"
sub-margin-y=36

# --- Screenshots ---
screenshot-format=png
screenshot-high-bit-depth=yes
screenshot-directory="~/Pictures/Screenshots"
screenshot-template="mpv_%Y-%m-%d_%H-%M-%S"

# --- Languages Preferences ---
alang=ja,jp,jpn,en,eng
slang=en,eng
