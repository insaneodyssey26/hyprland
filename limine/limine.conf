timeout: 10
default_entry: Arch Linux/Zen

# Wallpaper & theme
wallpaper: boot():/limine-wallpaper.png
wallpaper_style: stretched
backdrop: 0a0a0c

# Interface branding & help
interface_branding_colour: c0c5e0
interface_help_colour: 909097
interface_help_colour_bright: d9b9ff

# Terminal card styling
term_font_spacing: 1
term_background: b00e0e11
term_foreground: ffffff
term_margin: 64
term_margin_gradient: 12

# Palette & highlights
term_palette: 0e0e11;ffb4ab;c0c5e0;e5e2e4;c0c5e0;c6c6cd;909097;ffffff
term_palette_bright: 1b1b1f;ffb4ab;c0c5e0;ffffff;c0c5e0;c6c6cd;909097;ffffff

# Boot entries
/+Arch Linux
    //Zen
        protocol: linux
        path: boot():/vmlinuz-linux-zen
        cmdline: root=UUID=9ee82268-55c2-4523-9eaa-70f475163f23 rw rootflags=subvol=@ quiet loglevel=3 rd.udev.log_level=3 udev.log_priority=3 vt.global_cursor_default=0 systemd.show_status=auto nowatchdog
        module_path: boot():/initramfs-linux-zen.img

    //LTS
        protocol: linux
        path: boot():/vmlinuz-linux-lts
        cmdline: root=UUID=9ee82268-55c2-4523-9eaa-70f475163f23 rw rootflags=subvol=@ quiet loglevel=3 rd.udev.log_level=3 udev.log_priority=3 vt.global_cursor_default=0 systemd.show_status=auto nowatchdog
        module_path: boot():/initramfs-linux-lts.img

/Windows 11
    protocol: efi
    path: boot():/EFI/Microsoft/Boot/bootmgfw.efi
