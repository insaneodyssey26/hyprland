include colors.conf

font_family                 Maple Mono NF
font_size                   12
bold_font                   auto
italic_font                 auto
bold_italic_font            auto
remember_window_size        no
initial_window_width        950
initial_window_height       500
cursor_blink_interval       0.5
cursor_stop_blinking_after  1
scrollback_lines            2000
wheel_scroll_min_lines      1
enable_audio_bell           no
window_padding_width        15
hide_window_decorations     yes
background_opacity          0.8
dynamic_background_opacity  yes
confirm_os_window_close     0
selection_foreground        none
selection_background        none

# Cursor trail
cursor_trail                10
cursor_trail_decay          0.1 0.35
cursor_trail_start_threshold 0
repaint_delay               6
input_delay                 1

# Tab bar
tab_bar_edge                top
tab_bar_style               separator
tab_separator               ""
tab_bar_margin_width        10
tab_bar_margin_height       10 0
tab_bar_min_tabs            1
tab_title_template          "{fmt.fg.color8}{fmt.bg.default}{fmt.fg.color7}{fmt.bg.color8} {index} 󰉋 {title} {fmt.fg.color8}{fmt.bg.default} "
active_tab_title_template   "{fmt.fg.color2}{fmt.bg.default}{fmt.fg.color0}{fmt.bg.color2} {index} 󰉋 {title} {fmt.fg.color2}{fmt.bg.default} "
active_tab_font_style       bold

# Keybindings
map ctrl+t                  new_tab
map ctrl+w                  close_tab
map ctrl+tab                next_tab
map ctrl+shift+tab          previous_tab

map ctrl+1                  goto_tab 1
map ctrl+2                  goto_tab 2
map ctrl+3                  goto_tab 3
map ctrl+4                  goto_tab 4
map ctrl+5                  goto_tab 5
map ctrl+6                  goto_tab 6
map ctrl+7                  goto_tab 7
map ctrl+8                  goto_tab 8
map ctrl+9                  goto_tab 9

map ctrl+c                  copy_or_interrupt
map ctrl+v                  paste_from_clipboard
