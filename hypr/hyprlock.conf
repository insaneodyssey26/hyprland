source = $HOME/.config/hypr/colors.conf

general {
    disable_loading_bar = true
    hide_cursor = false
    grace = 0
    no_fade_in = false
    immediate_render = true
}

background {
    monitor =
    path = $HOME/.current_wallpaper
    color = $surface
    blur_passes = 3
    blur_size = 9
    noise = 0.0117
    contrast = 0.9
    brightness = 0.6
    vibrancy = 0.2
}

# masum@Arch
label {
    monitor =
    text = masum@Arch
    color = $on_surface
    font_size = 13
    font_family = Geist SemiBold
    position = 36, -26
    halign = left
    valign = top
}

# Wi-Fi & battery status
label {
    monitor =
    text = cmd[update:2000] echo "$(wifi=$(nmcli -t -f TYPE,NAME connection show --active 2>/dev/null | grep -iE 'wireless|wifi' | head -n 1 | cut -d: -f2); [ -n "$wifi" ] && echo "󰤨   $wifi   <span foreground=\"##ffffff50\">|</span>   ")$([ "$(cat /sys/class/power_supply/BAT1/status 2>/dev/null)" = "Charging" ] && echo '󱐋  ' || echo '   ')$(cat /sys/class/power_supply/BAT1/capacity 2>/dev/null)%"
    color = rgba(255, 255, 255, 0.85)
    font_size = 13
    font_family = Geist Medium
    position = -36, -26
    halign = right
    valign = top
}

# Arch logo
label {
    monitor =
    text = 󰣇
    color = $primary
    font_size = 20
    font_family = GeistMono Nerd Font
    position = 36, 26
    halign = left
    valign = bottom
}

# Uptime
label {
    monitor =
    text = cmd[update:60000] echo "up $(uptime -p | sed 's/up //')"
    color = $outline
    font_size = 12
    font_family = Geist Medium
    position = -36, 26
    halign = right
    valign = bottom
}

# Date
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%A, %B %-d')"
    color = rgba(255, 255, 255, 0.75)
    font_size = 18
    font_family = Geist SemiBold
    position = 0, 240
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.6)
}

# Clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%I:%M %p')"
    color = rgba(255, 255, 255, 0.95)
    font_size = 84
    font_family = Geist Bold
    position = 0, 150
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.7)
}

# Avatar
image {
    monitor =
    path = $HOME/.config/hypr/assets/avatar.jpg
    size = 110
    rounding = -1
    border_size = 3
    border_color = rgba(255, 255, 255, 0.4)
    position = 0, 0
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.5)
}

# User name
label {
    monitor =
    text = $USER
    color = rgba(255, 255, 255, 0.9)
    font_size = 16
    font_family = Geist SemiBold
    position = 0, -85
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.6)
}

# Password input
input-field {
    monitor =
    size = 280, 52
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(255, 255, 255, 0.15)
    inner_color = rgba(0, 0, 0, 0.3)
    font_color = rgb(255, 255, 255)
    fade_on_empty = false
    font_family = Geist Medium
    placeholder_text = <span foreground="##ffffff70">Enter Password</span>
    hide_input = false
    rounding = 26
    check_color = $primary
    fail_color = rgb(242, 143, 173)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 200
    position = 0, -150
    halign = center
    valign = center
}

# Caps lock warning
label {
    monitor =
    text = cmd[update:250] echo "$([ $(cat /sys/class/leds/input*::capslock/brightness 2>/dev/null | grep -m 1 1) ] && echo '󰪛  Caps Lock is ON' || echo '')"
    color = rgb(242, 143, 173)
    font_size = 12
    font_family = Geist Medium
    position = 0, -210
    halign = center
    valign = center
}
