source = $HOME/.config/hypr/colors.conf

general {
    disable_loading_bar = true
    hide_cursor = false
    grace = 0
    no_fade_in = false
    immediate_render = true
}

background {
    monitor =
    path = $HOME/.current_wallpaper
    color = $surface
    blur_passes = 3
    blur_size = 9
    noise = 0.0117
    contrast = 0.9
    brightness = 0.6
    vibrancy = 0.2
}

# Top Left: masum@Arch
label {
    monitor =
    text = masum@Arch
    color = $on_surface
    font_size = 13
    font_family = Geist SemiBold
    position = 36, -26
    halign = left
    valign = top
}

# Top Right: Wi-Fi (if connected) + Battery Status
label {
    monitor =
    text = cmd[update:2000] echo "$(wifi=$(nmcli -t -f TYPE,NAME connection show --active 2>/dev/null | grep -iE 'wireless|wifi' | head -n 1 | cut -d: -f2); [ -n "$wifi" ] && echo "󰤨   $wifi   <span foreground=\"##ffffff50\">|</span>   ")$([ "$(cat /sys/class/power_supply/BAT1/status 2>/dev/null)" = "Charging" ] && echo '󱐋  ' || echo '   ')$(cat /sys/class/power_supply/BAT1/capacity 2>/dev/null)%"
    color = rgba(255, 255, 255, 0.85)
    font_size = 13
    font_family = Geist Medium
    position = -36, -26
    halign = right
    valign = top
}

# Bottom Left: Arch Linux Emblem
label {
    monitor =
    text = 󰣇
    color = $primary
    font_size = 30
    font_family = Symbols Nerd Font
    position = 36, 26
    halign = left
    valign = bottom
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.45)
}

# Bottom Right: System Uptime
label {
    monitor =
    text = cmd[update:60000] echo "󱎫  $(uptime -p | sed -e 's/up //' -e 's/ hours\?,/h/' -e 's/ hour,/h/' -e 's/ minutes\?/m/' -e 's/ //g')"
    color = rgba(255, 255, 255, 0.7)
    font_size = 12
    font_family = Geist Medium
    position = -36, 26
    halign = right
    valign = bottom
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(0, 0, 0, 0.35)
}

# macOS Style Date (Above Clock)
label {
    monitor =
    text = cmd[update:43200000] echo "$(date +"%A, %B %d")"
    color = rgba(255, 255, 255, 0.85)
    font_size = 20
    font_family = Geist SemiBold
    position = 0, 310
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.3)
}

# macOS Style Hero Clock (Horizontal Single Line)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(255, 255, 255, 0.95)
    font_size = 100
    font_family = Geist Bold
    position = 0, 210
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.35)
}

# User Avatar Picture (Above User Name)
image {
    monitor =
    path = $HOME/.config/hypr/assets/avatar.jpg
    size = 80
    rounding = -1
    border_size = 2
    border_color = rgba(255, 255, 255, 0.35)
    rotate = 0
    reload_time = -1
    position = 0, 195
    halign = center
    valign = bottom
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.35)
}

# User Name (Above Password Box)
label {
    monitor =
    text = Masum
    color = rgba(255, 255, 255, 0.95)
    font_size = 18
    font_family = Geist SemiBold
    position = 0, 125
    halign = center
    valign = bottom
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(0, 0, 0, 0.35)
}

# Translucent Frosted Glass Password Input Pill
input-field {
    monitor =
    size = 260, 44
    outline_thickness = 1
    dots_size = 0.22
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.2)
    inner_color = rgba(15, 15, 20, 0.45)
    font_color = $on_surface
    check_color = $primary
    fail_color = $error
    fade_on_empty = false
    placeholder_text = <span foreground="##ffffff66">  Enter Password...</span>
    fail_text = <span foreground="##ffb4ab"><i>Incorrect ($ATTEMPTS)</i></span>
    hide_input = false
    rounding = -1
    position = 0, 65
    halign = center
    valign = bottom
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.3)
}

# Caps Lock Warning
label {
    monitor =
    text = cmd[update:500] echo "$([ "$(hyprctl devices -j 2>/dev/null | jq -r '.keyboards[] | select(.main == true) | .caps')" = "true" ] && echo '󰪛  Caps Lock Active')"
    color = $error
    font_size = 11
    font_family = Geist Medium
    position = 0, 26
    halign = center
    valign = bottom
}
