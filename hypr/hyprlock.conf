source = $HOME/.config/hypr/colors.conf

general {
    disable_loading_bar = true
    hide_cursor = false
    grace = 0
    no_fade_in = true
    immediate_render = true
}

background {
    monitor =
    path = $HOME/.current_wallpaper
    color = $surface
    blur_passes = 2
    blur_size = 10
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.4
    vibrancy = 0.2
}

# Top Left: masum@Arch
label {
    monitor =
    text = <span font_family="Maple Mono NF" weight="bold" foreground="##b3cad9">󰣇</span>  <span font_family="Maple Mono NF" weight="bold" foreground="##ffffff">masum@Arch</span>
    font_size = 14
    position = 35, -25
    halign = left
    valign = top
}

# Top Right: Battery
label {
    monitor =
    text = cmd[update:1000] echo "$([ "$(cat /sys/class/power_supply/BAT1/status 2>/dev/null)" = "Charging" ] && echo '󱐋' || echo '')   $(cat /sys/class/power_supply/BAT1/capacity 2>/dev/null)%"
    color = rgba(255, 255, 255, 0.8)
    font_size = 14
    font_family = Geist SemiBold
    position = -35, -25
    halign = right
    valign = top
}

# Top Clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(255, 255, 255, 0.8)
    font_size = 120
    font_family = Geist Bold
    position = 0, 340
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 5
}

# Date
label {
    monitor =
    text = cmd[update:43200000] echo "$(date +"%A, %B %d")"
    color = rgba(255, 255, 255, 0.7)
    font_size = 22
    font_family = Geist SemiBold
    position = 0, 240
    halign = center
    valign = center
}

# Center Arch Logo
label {
    monitor =
    text = 󰣇
    color = $primary
    font_size = 250
    font_family = Symbols Nerd Font
    position = 0, 0
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.4)
}

# User Name
label {
    monitor =
    text = Masum
    color = rgba(255, 255, 255, 0.9)
    font_size = 24
    font_family = Maple Mono NF Bold
    position = 0, 160
    halign = center
    valign = bottom
}

# Input Field
input-field {
    monitor =
    size = 280, 55
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.1)
    inner_color = rgba(0, 0, 0, 0.2)
    font_color = $primary
    check_color = $primary
    fail_color = rgba(237, 135, 150, 0.85)
    fade_on_empty = false
    placeholder_text = <span foreground="##ffffff66">Enter Password</span>
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    hide_input = false
    rounding = 25
    position = 0, 80
    halign = center
    valign = bottom
}

# Caps Lock Warning
label {
    monitor =
    text = cmd[update:500] echo "$([ "$(hyprctl devices -j 2>/dev/null | jq -r '.keyboards[] | select(.main == true) | .caps')" = "true" ] && echo '󰪛  Caps Lock ON')"
    color = rgba(237, 135, 150, 0.9)
    font_size = 12
    font_family = Geist Bold
    position = -50, 50
    halign = right
    valign = bottom
}
