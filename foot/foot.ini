[main]
include=~/.config/foot/colors.ini
font=Maple Mono NF:size=12
initial-window-size-pixels=950x500
pad=15x15
dpi-aware=no
selection-target=both

[scrollback]
lines=2000

[cursor]
style=beam
blink=yes

[bell]
system=no

[colors-dark]
alpha=0.8

[key-bindings]
clipboard-copy=Control+Shift+c
clipboard-paste=Control+v
